    <style>
        * { box-sizing: border-box; }
        html {
            margin: 0;
            padding: 0;
            scroll-snap-type: y mandatory;

        body {
            margin: 0;
            padding: 0;

            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Work Sans', system-ui, sans-serif;

        /* Shared corner inset for section number and piece title */
        :root {
            --category-corner-inset: 1.5rem;
        }
        /* Section number: top right with padding */
        .category-section-num {
            position: absolute;
            top: var(--category-corner-inset);
            right: var(--category-corner-inset);
            padding-top: env(safe-area-inset-top, 0);
            padding-right: env(safe-area-inset-right, 0);
            font-size: clamp(0.875rem, 2vw, 1.125rem);
            font-weight: 500;
            letter-spacing: 0.05em;
            color: rgba(248, 248, 248, 0.7);
            z-index: 2;
        }
        /* Each section = one 1920×1080 “page” (16:9) */
        .category-section {
            width: 100%;
            height: 56.25vw;
            min-height: 100vh;
            min-height: 100dvh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
        }
        /* 3D: two sections tall, image from top down, text centered */

            width: 100%;
            height: 112.5vw; /* 2 × 56.25vw = 2 sections */

            min-height: 200dvh;

            scroll-snap-stop: always;

            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        /* 3D section 2: two images left and right */

            align-items: stretch;
            gap: 0;
            padding: 1.5rem;
            background: #000;

        .category-3d-section-2 .category-3d-img-wrap {

        /* Menu button (same as art index) – top left, links back to portfolio */
        .category-menu-btn {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            padding: 0;
            padding-left: env(safe-area-inset-left, 0);
            padding-top: env(safe-area-inset-top, 0);
            margin: 0.5rem;
            margin-left: calc(0.5rem + env(safe-area-inset-left, 0));
            margin-top: calc(0.5rem + env(safe-area-inset-top, 0));
            background: transparent;
            border: none;
            cursor: pointer;
            color: #F8F8F8;
            -webkit-tap-highlight-color: transparent;
            text-decoration: none;
        }
        .category-menu-btn-icon {
            width: 18px;
            height: 14px;
            position: relative;
        }
        .category-menu-btn-icon::before,
        .category-menu-btn-icon::after,
        .category-menu-btn-icon {
            display: block;
            content: '';
            position: absolute;
            left: 0;
            width: 100%;
            height: 1.5px;
            background: currentColor;
            border-radius: 1px;
            transition: transform 0.3s ease;
        }
        .category-menu-btn-icon {
            top: 50%;
            width: calc(100% - 5px);
            left: 5px;
            transform: translateY(-50%) translateX(0);
        }
        .category-menu-btn-icon::before { top: -5px; transform: translateX(0); }
        .category-menu-btn-icon::after { top: 5px; transform: translateX(0); }
        .category-menu-btn:hover .category-menu-btn-icon,
        .category-menu-btn:focus .category-menu-btn-icon {
            left: 0;
            width: 100%;
            transform: translateY(-50%) translateX(-5px);
        }
        .category-menu-btn:hover .category-menu-btn-icon::before,
        .category-menu-btn:hover .category-menu-btn-icon::after,
        .category-menu-btn:focus .category-menu-btn-icon::before,
        .category-menu-btn:focus .category-menu-btn-icon::after {
            transform: translateX(5px);
        }
        .category-menu-btn:hover .category-menu-btn-icon::before,
        .category-menu-btn:hover .category-menu-btn-icon::after,
        .category-menu-btn:hover .category-menu-btn-icon,
        .category-menu-btn:focus .category-menu-btn-icon::before,
        .category-menu-btn:focus .category-menu-btn-icon::after,
        .category-menu-btn:focus .category-menu-btn-icon {
            background-image: linear-gradient(90deg, currentColor 0%, currentColor 32%, rgba(255,255,255,0.4) 38%, rgba(255,255,255,0.4) 45%, currentColor 52%, currentColor 100%);
            background-size: 200% 100%;
            animation: category-menu-line-slide 0.45s ease-out 1 forwards;
        }
        @keyframes category-menu-line-slide {
            from { background-position: 100% 0; }
            to { background-position: 0 0; }
        }
        .category-menu-btn[aria-expanded="true"] .category-menu-btn-icon,
        .category-menu-btn[aria-expanded="true"]:hover .category-menu-btn-icon,
        .category-menu-btn[aria-expanded="true"]:focus .category-menu-btn-icon {
            left: 5px;
            width: calc(100% - 5px);
            transform: translateY(-50%) translateX(0);
            background-image: none;
            background: currentColor;
            animation: none;
        }
        .category-menu-btn[aria-expanded="true"] .category-menu-btn-icon::before,
        .category-menu-btn[aria-expanded="true"] .category-menu-btn-icon::after,
        .category-menu-btn[aria-expanded="true"]:hover .category-menu-btn-icon::before,
        .category-menu-btn[aria-expanded="true"]:hover .category-menu-btn-icon::after,
        .category-menu-btn[aria-expanded="true"]:focus .category-menu-btn-icon::before,
        .category-menu-btn[aria-expanded="true"]:focus .category-menu-btn-icon::after {
            transform: translateX(0);
            background-image: none;
            background: currentColor;
            animation: none;
        }

                                thumb.classList.add('active');

                (function setupTDVideos() {
                    var videos = container.querySelectorAll('.category-td-group video');
                    function togglePlay(el) {
                        if (el.paused) el.play(); else el.pause();
                    }
                    videos.forEach(function (v) {
                        v.addEventListener('click', function () { togglePlay(v); });
                        if (v.hasAttribute('data-reverse-loop')) {
                            v.playbackRate = 1;
                            v.addEventListener('ended', function () {
                                var start = null;
                                function reverseTick(ts) {
                                    if (!start) start = ts;
                                    var elapsed = (ts - start) / 1000;
                                    var dur = v.duration;
                                    if (!(dur > 0)) return;
                                    var target = Math.max(0, dur - elapsed);
                                    v.currentTime = target;
                                    if (target <= 0) {
                                        v.currentTime = 0;
                                        v._reverseRafId = null;
                                        v.play();
                                        return;
                                    }
                                    v._reverseRafId = requestAnimationFrame(reverseTick);
                                }
                                v._reverseRafId = requestAnimationFrame(reverseTick);
                            });
                            v.addEventListener('pause', function () {
                                if (v._reverseRafId != null) {
                                    cancelAnimationFrame(v._reverseRafId);
                                    v._reverseRafId = null;
                                }
                            });
                        }
                        var obs = new IntersectionObserver(function (entries) {
                            entries.forEach(function (e) {
                                if (e.isIntersecting) e.target.play(); else e.target.pause();
                            });
                        }, { rootMargin: '20%', threshold: 0.25 });
                        obs.observe(v);

                if (!drawer) return;

                    else openDrawer();
                });
            }
            if (backdrop) backdrop.addEventListener('click', closeDrawer);

                });
