<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting…</title>
    <script>
        (function () {
            var path = window.location.pathname;
            var base = path.replace(/\/?websites\/?.*$/, '');
            if (!base.endsWith('/')) base += '/';
            window.location.replace(base + '?/websites/');
        })();
    </script>
</head>
<body></body>
</html>
